<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="790" viewBox="0 0 1600 790">
<title>NF-BW01 Aegis Battery Exchange Workstation - Gate 01 conceptual orthographic layout</title>
<desc>Proposed 3800 millimeter wide, 2400 millimeter deep, 3400 millimeter high robot-assisted battery workstation. Orthographic top, front, and right elevation. Concept only, not actual mesh.</desc>
<defs>
  <marker id="end" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#1e3748" stroke-width="1.4"/></marker>
  <pattern id="grip" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="11" height="11" fill="#e6edf0"/><line x1="0" y1="0" x2="0" y2="11" stroke="#a4b4bd" stroke-width="2"/></pattern>
  <style>
    text{font-family:"Arial","DejaVu Sans",sans-serif;fill:#14232e}
    .title{font-size:26px;font-weight:bold;letter-spacing:1px}
    .subtitle{font-size:13px;fill:#4e6170;letter-spacing:.4px}
    .panel{fill:#fff;stroke:#bcc8d0;stroke-width:1.4}
    .view{font-size:19px;font-weight:bold;letter-spacing:1px}
    .label{font-size:13px;font-weight:600}
    .small{font-size:11.5px;fill:#4d606b}
    .dimension{font-size:14px;font-weight:bold}
    .edge{fill:none;stroke:#1b3444;stroke-width:2.3}
    .thin{fill:none;stroke:#577080;stroke-width:1.2}
    .dash{fill:none;stroke:#7e929e;stroke-width:1.35;stroke-dasharray:7 5}
    .base{fill:#f1f4f6;stroke:#1b3444;stroke-width:2.3}
    .machine{fill:#dbe4e8;stroke:#1b3444;stroke-width:2.2}
    .tool{fill:#8ea0ac;stroke:#1b3444;stroke-width:2.2}
    .highlight{fill:url(#grip);stroke:#1b3444;stroke-width:2}
    .axis{stroke:#a3b3bb;stroke-width:1;stroke-dasharray:5 4}
  </style>
</defs>
