name: FORGE / CC0 Donor Vehicle Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/forge-donor-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  donor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download openly licensed original automotive body
        run: |
          set -euo pipefail
          mkdir -p build/donor
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 100 \
            --user-agent "NFR-Modeling-Pipeline/1.0" \
            "https://www.innerscene.com/api/library/generic-mid-engine-supercar-73f252c5/download" \
            --output build/donor/original_CC0_mid_engine_supercar.glb
          python - <<'PY'
          from pathlib import Path
          import struct,hashlib
          p=Path("build/donor/original_CC0_mid_engine_supercar.glb")
          b=p.read_bytes()
          assert b[:4]==b'glTF' and struct.unpack_from('<I',b,8)[0]==len(b)
          assert len(b)>200000, len(b)
          print("NFR_DONOR_GLTF_DOWNLOADED",len(b),hashlib.sha256(b).hexdigest())
          PY
      - name: Install offline geometry inspection dependencies
        run: |
          python -m pip install --disable-pip-version-check "numpy==2.3.5" "trimesh==4.11.1" "networkx==3.6.1" "scipy==1.17.0" "Pillow>=10,<13"
      - name: Audit material and independent body versus wheel geometry
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,numpy as np,trimesh
          p=Path("build/donor/original_CC0_mid_engine_supercar.glb")
          s=trimesh.load(p,force="scene",process=False)
          meshes=[]
          for name,m in sorted(s.geometry.items()):
              if not hasattr(m,'faces'):continue
              nodes=s.graph.nodes_geometry
              meshes.append(dict(name=name,vertices=len(m.vertices),triangles=len(m.faces),
                                bounds=np.round(m.bounds,4).tolist(),dimensions=np.round(m.extents,4).tolist(),
                                watertight=bool(m.is_watertight)))
          info=dict(source="Innerscene original generic mid-engine supercar",source_url="https://www.innerscene.com/tools/library/3d-parts/generic-mid-engine-supercar-73f252c5",
                    license="CC0 per original model page",mesh_count=len(meshes),triangles=sum(x['triangles'] for x in meshes),
                    scene_bounds=np.round(s.bounds,4).tolist(),
                    scene_extents=np.round(s.extents,4).tolist(),meshes=meshes,
                    graph_nodes=[str(x) for x in s.graph.nodes_geometry])
          Path("build/donor/DONOR_AUDIT.json").write_text(json.dumps(info,indent=2)+"\n")
          print("NFR_DONOR_AUDITED",info['mesh_count'],info['triangles'],info['scene_extents'])
          for x in meshes:print("PART",x['name'],x['triangles'],x['bounds'])
          PY
      - name: Publish donor inspection inputs for conversion experiment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FORGE-CC0-Donor-Audit
          path: build/donor/
          retention-days: 7
          if-no-files-found: warn
