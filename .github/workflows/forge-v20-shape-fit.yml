name: NF-H01 / V20 Reference-Guided Real Geometry Trial

on:
  push:
    branches: [main]
    paths:
      - 'tools/build_forge_v20_shape_fit.py'
      - 'tools/forge_v20_preview.py'
      - 'tools/forge_v20_reference_diagnostics.py'
      - '.github/workflows/forge-v20-shape-fit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfr-forge-v20-shape-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fit-and-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free, pinned CPU-only geometry packages
        run: |
          python -m pip install --disable-pip-version-check \
            'numpy==2.3.5' 'scipy==1.17.0' 'trimesh==4.11.1' 'networkx==3.6.1' \
            'pillow>=10,<13' 'opencv-python-headless>=4.8,<5'
      - name: Build V20 physically modified GLB and four-view comparison
        run: |
          set -euo pipefail
          python tools/build_forge_v20_shape_fit.py 2>&1 | tee /tmp/nfr-v20.log
          grep -q NFR_V20_REAL_SHAPE_FIT_OK /tmp/nfr-v20.log
      - name: Render five neutral shaded views of actual V20 GLB
        env:
          NFR_PREVIEW_SOURCE: build/forge_v20_shape_fit/FORGE_V20_ReferenceShapeFit.glb
          NFR_PREVIEW_OUTPUT: build/forge_v20_shape_fit/previews
        run: |
          set -euo pipefail
          python tools/forge_v20_preview.py 2>&1 | tee /tmp/nfr-v20-preview.log
          grep -q NFR_V20_PREVIEW_OK /tmp/nfr-v20-preview.log
      - name: Audit independently reloaded output and regression guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import trimesh
          from PIL import Image
          dest=Path('build/forge_v20_shape_fit')
          f=dest/'FORGE_V20_ReferenceShapeFit.glb'
          r=json.loads((dest/'FORGE_V20_SHAPE_FIT_REPORT.json').read_text())
          model=trimesh.load(f,force='scene',process=False)
          assert len(model.geometry)==330
          assert r['modified_meshes']>60
          assert r['rear_wings_unchanged']
          assert r['main_thrusters_unchanged']
          assert not r['automated_owner_approval']
          assert not r['production_asset_replaced']
          assert f.stat().st_size>200_000
          for tag in ('PORT','STBD'):
            assert 'V15_326_'+tag+'_ForeWingSculptedRoot' in model.geometry
            assert 'V15_322_'+tag+'_SweepbackFin' in model.geometry
            assert 'V15_320_'+tag+'_IntegratedSweptRearSideWing' in model.geometry
          for v in ('side','top','front','rear'):
            assert Image.open(dest/('FORGE_V20_REFERENCE_AB_'+v+'.png')).width>600
          for v in ('side','top','front_three_quarter','rear_three_quarter','rear'):
            assert Image.open(dest/'previews'/('FORGE_V20_GLB_'+v+'.png')).size==(1100,720)
          print('NFR_V20_MODEL_EXPORT_GEOMETRY_AUDIT_OK')
          PY
      - name: Upload actual GLB plus rendered comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NF-H01-FORGE-V20-ReferenceShapeFit-GLB
          path: build/forge_v20_shape_fit/
          retention-days: 30
          if-no-files-found: warn
      - name: Publish only verified experiment, never approved production assets
        if: success()
        run: |
          set -euo pipefail
          mkdir -p art/hero_01/experiments/V20/previews
          cp build/forge_v20_shape_fit/FORGE_V20_ReferenceShapeFit.glb art/hero_01/experiments/V20/
          cp build/forge_v20_shape_fit/FORGE_V20_SHAPE_FIT_REPORT.json art/hero_01/experiments/V20/
          cp build/forge_v20_shape_fit/FORGE_V20_REFERENCE_AB_*.png art/hero_01/experiments/V20/
          cp build/forge_v20_shape_fit/previews/FORGE_V20_GLB_*.png art/hero_01/experiments/V20/previews/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/hero_01/experiments/V20/
          if ! git diff --cached --quiet; then
            git commit -m 'Publish audited V20 reference-guided Forge GLB and previews'
            git push
          fi
