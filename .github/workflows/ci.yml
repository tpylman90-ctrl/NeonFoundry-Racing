name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.5.1

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Repository validation
        run: |
          set -euo pipefail
          python3 tools/check_repository.py
          python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Install pinned Godot
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable"
          curl --fail --location --retry 3 "$base/Godot_v$GODOT_VERSION-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install "/tmp/Godot_v$GODOT_VERSION-stable_linux.x86_64" /usr/local/bin/godot
          godot --version
      - name: Godot import and startup smoke
        run: |
          set -euo pipefail
          godot --headless --path game --editor --import --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR:|ERROR:' import.log; then exit 1; fi
          timeout 60 godot --headless --path game --quit-after 5 2>&1 | tee launch.log
          if grep -E 'SCRIPT ERROR:|ERROR:' launch.log; then exit 1; fi
      - name: Test title and menu navigation
        run: |
          set -euo pipefail
          timeout 90 godot --headless --path game --script res://tests/menu_smoke_test.gd 2>&1 | tee menu-smoke.log
          if grep -E 'SCRIPT ERROR:|ERROR:' menu-smoke.log; then exit 1; fi
          grep -q NEON_FOUNDRY_MENU_SMOKE_OK menu-smoke.log
