name: Repository checks

on:
  push:
    branches: [main, 'upgrade/godot-4.7.2-blender-5.2.4', 'graphics/garage-cinematic-lighting-pass', 'garage/stage01-shell-surfaces', 'garage/stage01-pbr-orm-bake', 'garage/dual-thumb-walk-controls', 'garage/stage01-expanded-footprint']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Repository validation
        run: |
          set -euo pipefail
          python3 tools/check_repository.py
          python3 -m py_compile tools/build_garage_shell.py tools/garage_shell_pbr.py tools/validate_shell_pbr.py
          python3 tools/validate_hero_workflow.py
          python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Install pinned Godot
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable"
          curl --fail --location --retry 3 "$base/Godot_v$GODOT_VERSION-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install "/tmp/Godot_v$GODOT_VERSION-stable_linux.x86_64" /usr/local/bin/godot
          godot --version
      - name: Restore Stage 01 shell cache
        uses: actions/cache@v4
        id: shell-cache
        with:
          path: |
            game/assets/garage/shell/shell_stage01.glb
            build/garage_shell_stage01.blend
            build/shell_source/
          key: foundry-shell-blender52-${{ hashFiles('tools/build_garage_shell.py', 'tools/garage_shell_pbr.py') }}
      - name: Generate isolated Blender hangar shell (Stage 01)
        if: steps.shell-cache.outputs.cache-hit != 'true'
        timeout-minutes: 12
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libx11-6 libxrender1 libxi6
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 5 https://download.blender.org/release/Blender5.2/blender-5.2.4-linux-x64.tar.xz -o /tmp/blender-shell.tar.xz
          tar -xf /tmp/blender-shell.tar.xz -C /tmp
          mkdir -p build game/assets/garage/shell
          /tmp/blender-5.2.4-linux-x64/blender --background --threads 4 --python tools/build_garage_shell.py 2>&1 | tee build/garage-shell-generator.log
          grep -q NEON_FOUNDRY_SHELL_STAGE01_OK build/garage-shell-generator.log
          test -s game/assets/garage/shell/shell_stage01.glb
          test -s build/garage_shell_stage01.blend
          python3 - <<'PY'
          from pathlib import Path
          import struct
          asset = Path('game/assets/garage/shell/shell_stage01.glb')
          assert asset.read_bytes()[:4] == b'glTF'
          assert struct.unpack('<I', asset.read_bytes()[8:12])[0] == asset.stat().st_size
          print('NEON_FOUNDRY_SHELL_GLB_VALID', asset.stat().st_size)
          PY
      - name: Validate glTF materials, packed ORM and baked normals
        run: |
          set -euo pipefail
          python3 tools/validate_shell_pbr.py
          test -s build/shell_source/NF_SHELL_floor_ORM.png
          test -s build/shell_source/NF_SHELL_wall_long_ORM.png
          test -s build/shell_source/NF_SHELL_wall_side_ORM.png
          test -s build/shell_source/NF_SHELL_ceiling_ORM.png
          test -s build/shell_source/NF_SHELL_floor_bakedNormalGL.png
      - name: Godot import and startup smoke
        run: |
          set -euo pipefail
          python3 tools/stage_garage_preview.py
          python3 tools/stage_garage_cc0.py
          python3 tools/stage_garage_factory_props.py
          godot --headless --path game --editor --import --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR:|ERROR:' import.log; then exit 1; fi
          timeout 60 godot --headless --path game --quit-after 5 2>&1 | tee launch.log
          if grep -E 'SCRIPT ERROR:|ERROR:' launch.log; then exit 1; fi
      - name: Test title and menu navigation
        run: |
          set -euo pipefail
          timeout 90 godot --headless --path game --script res://tests/menu_smoke_test.gd 2>&1 | tee menu-smoke.log
          if grep -E 'SCRIPT ERROR:|ERROR:' menu-smoke.log; then exit 1; fi
          grep -q NEON_FOUNDRY_MENU_SMOKE_OK menu-smoke.log
