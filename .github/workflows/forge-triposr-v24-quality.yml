name: Forge V24 TripoSR neural geometry quality investigation

on:
  push:
    branches: [experiments/forge-triposr-trial]
    paths:
      - .github/workflows/forge-triposr-v24-quality.yml
      - tools/triposr_v24_quality_sweep.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v24-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      HF_HUB_DISABLE_TELEMETRY: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Prepare same-camera comparison images with checksums
        id: prepare
        run: |
          exec > >(tee "$RUNNER_TEMP/v24_prepare.log") 2>&1
          python -m pip install 'Pillow==10.1.0' 'numpy==1.26.4'
          python tools/triposr_v24_quality_sweep.py prepare
      - name: Install validated native TripoSR inference and renderer
        id: install
        timeout-minutes: 35
        run: |
          exec > >(tee "$RUNNER_TEMP/v24_install.log") 2>&1
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.2.2' 'torchvision==0.17.2'
          python -m pip install 'numpy==1.26.4' 'Pillow==10.1.0' 'omegaconf==2.3.0' 'einops==0.7.0' 'transformers==4.35.0' 'trimesh==4.0.5' 'huggingface-hub<1' 'rembg==2.0.60' 'onnxruntime==1.19.2' 'imageio[ffmpeg]' 'xatlas==0.0.9' 'moderngl==5.10.0' 'scikit-image==0.22.0' 'scipy==1.15.3'
          python -m pip install --force-reinstall --no-deps 'numpy==1.26.4'
          python -m pip install 'scikit-build-core>=1.0' 'pybind11>=2.10' ninja
          CMAKE_BUILD_PARALLEL_LEVEL=2 python -m pip install --no-build-isolation 'git+https://github.com/tatsy/torchmcubes.git'
          python -c "import numpy, torch, torchmcubes, moderngl, xatlas, trimesh; assert numpy.__version__=='1.26.4'; print('V24_DEPS_READY', torch.__version__)"
          git clone --depth 1 https://github.com/VAST-AI-Research/TripoSR.git /tmp/triposr
          PYTHONPATH=/tmp/triposr python -c "from tsr.system import TSR; from tsr.bake_texture import bake_texture; print('V24_OFFICIAL_TRIPOSR_IMPORTS_OK')"
      - name: Run neural views, reusable density sweeps and optional texture baking
        id: inference
        timeout-minutes: 75
        run: |
          exec > >(tee "$RUNNER_TEMP/v24_inference.log") 2>&1
          PYTHONPATH=/tmp/triposr python tools/triposr_v24_quality_sweep.py run
      - name: Verify completed report
        id: verify
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('build/triposr_v24_quality/V24_REPORT.json')
          assert p.is_file(), 'Missing V24 report'
          r=json.loads(p.read_text())
          assert r['status']=='COMPLETED',r['status']
          for name in ('flat','contrast'):
              assert r['inputs'][name]['meshes']['25']['status']=='ok',name
              assert r['inputs'][name]['neural_render']['status']=='ok',name
          print('V24_VERIFIED_NEURAL_AND_MESH',[(k,r['inputs'][k]['meshes']['25']['triangles']) for k in ('flat','contrast')])
          PY
      - name: Upload real neural renders, GLBs, atlas and logs
        id: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Forge-V24-Neural-Threshold-Sweep-${{ github.run_number }}
          path: |
            build/triposr_v24_quality/
            ${{ runner.temp }}/v24_*.log
          if-no-files-found: warn
          retention-days: 14
      - name: Publish inspectable run diagnostic on experimental branch
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),path=require('path');
            const steps={
              prepare:'${{ steps.prepare.outcome }}',
              install:'${{ steps.install.outcome }}',
              inference:'${{ steps.inference.outcome }}',
              verify:'${{ steps.verify.outcome }}',
              artifact:'${{ steps.artifact.outcome }}'
            };
            const errors={};
            for(const k of ['prepare','install','inference']){
              const f=path.join(process.env.RUNNER_TEMP||'/tmp','v24_'+k+'.log');
              errors[k]=fs.existsSync(f)?fs.readFileSync(f,'utf8').split(/\r?\n/).filter(
                s=>/Traceback|Error|Exception|failed|Killed|out of memory|V24_/i.test(s)
              ).slice(-20).map(s=>s.slice(0,260)):[];
            }
            const {owner,repo}=context.repo;
            const branch=context.ref.replace(/^refs\/heads\//,'');
            const p='art/hero_01/experiments/forge_v24_last_run.json';
            const report={
              run_id:context.runId,
              run_url:'https://github.com/'+owner+'/'+repo+'/actions/runs/'+context.runId,
              commit:context.sha,status:'${{ job.status }}',steps,errors,
              note:'V24 two-input single-view reconstruction + direct neural renders + density-threshold sweep. Production untouched.'
            };
            let sha;
            try{const old=await github.rest.repos.getContent({owner,repo,path:p,ref:branch});sha=old.data.sha;}
            catch(e){if(e.status!==404)throw e;}
            await github.rest.repos.createOrUpdateFileContents({
              owner,repo,path:p,branch,message:'ci: report Forge V24 TripoSR quality benchmark',
              content:Buffer.from(JSON.stringify(report,null,2)+'\n').toString('base64'),
              ...(sha?{sha}:{})
            });
