name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'tools/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.5.1

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Verify project contract
        run: python3 tools/check_repository.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK tools
        run: sdkmanager "platform-tools" "build-tools;35.0.0" "platforms;android-35"
      - name: Install official Godot 4.5.1 and Android export templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable"
          curl --fail --location --retry 3 "$base/Godot_v$GODOT_VERSION-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install "/tmp/Godot_v$GODOT_VERSION-stable_linux.x86_64" /usr/local/bin/godot
          curl --fail --location --retry 3 "$base/Godot_v$GODOT_VERSION-stable_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz 'templates/android_debug.apk' 'templates/android_release.apk' -d /tmp
          mkdir -p "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable"
          cp /tmp/templates/*.apk "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable/"
          godot --version
      - name: Configure Godot Android export environment
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot" build
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          python3 - <<'PY'
          from pathlib import Path
          import os
          text = '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n'
          for key, value in {
              "export/android/android_sdk_path": os.environ["ANDROID_HOME"],
              "export/android/java_sdk_path": os.environ["JAVA_HOME"],
              "export/android/debug_keystore": str(Path.home()/".android/debug.keystore"),
              "export/android/debug_keystore_user": "androiddebugkey",
              "export/android/debug_keystore_pass": "android",
          }.items():
              text += f'{key}="{value}"\n'
          (Path.home()/".config/godot/editor_settings-4.5.tres").write_text(text)
          p=Path("game/export_presets.cfg")
          p.write_text(p.read_text().replace("version/code=1", "version/code="+os.environ["GITHUB_RUN_NUMBER"]))
          PY
      - name: Cache rendered Blender hero scene
        id: menu-cache
        uses: actions/cache@v4
        with:
          path: |
            game/assets/menu/launch_scene.png
            build/menu_hero.blend
          key: neon-menu-hero-blender45-v1-${{ hashFiles('tools/build_menu_hero.py') }}
      - name: Render original 3D menu art with Blender 4.5
        if: steps.menu-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p game/assets/menu build
          curl --fail --location --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
          NEON_MENU_SAMPLES=28 /tmp/blender-4.5.3-linux-x64/blender --background --threads 4 --python tools/build_menu_hero.py 2>&1 | tee build/blender-menu.log
          grep -q NEON_FOUNDRY_BLENDER_MENU_OK build/blender-menu.log
          test -s game/assets/menu/launch_scene.png
          test -s build/menu_hero.blend
      - name: Validate Blender scene output
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path('game/assets/menu/launch_scene.png')
          data=p.read_bytes()
          assert data[:8]==bytes((137,80,78,71,13,10,26,10))
          assert struct.unpack_from('>II',data,16)==(1600,900)
          assert p.stat().st_size>150000
          assert Path('build/menu_hero.blend').stat().st_size>100000
          print('NEON_FOUNDRY_RENDERED_ART_OK 1600x900')
          PY
      - name: Import and smoke-test project
        run: |
          set -euo pipefail
          godot --headless --path game --editor --import --quit 2>&1 | tee build/import.log
          if grep -E 'SCRIPT ERROR:|ERROR:' build/import.log; then exit 1; fi
          godot --headless --path game --quit-after 5 2>&1 | tee build/smoke.log
          if grep -E 'SCRIPT ERROR:|ERROR:' build/smoke.log; then exit 1; fi
      - name: Run menu navigation smoke test
        run: |
          set -euo pipefail
          timeout 90 godot --headless --path game --script res://tests/menu_smoke_test.gd 2>&1 | tee build/menu-smoke.log
          if grep -E 'SCRIPT ERROR:|ERROR:' build/menu-smoke.log; then exit 1; fi
          grep -q NEON_FOUNDRY_MENU_SMOKE_OK build/menu-smoke.log
      - name: Capture title and main menu on software Vulkan
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers vulkan-tools libvulkan1
          ICD="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$ICD"
          export VK_ICD_FILENAMES="$ICD"
          for screen in title menu settings; do
            timeout 120 xvfb-run -a godot --audio-driver Dummy --path game --rendering-method mobile --rendering-driver vulkan --resolution 1280x720 res://scenes/title_menu.tscn -- --capture-"$screen" 2>&1 | tee "build/menu-capture-$screen.log"
            if grep -E 'SCRIPT ERROR:|ERROR:' "build/menu-capture-$screen.log"; then exit 1; fi
            grep -q NEON_FOUNDRY_MENU_CAPTURE_OK "build/menu-capture-$screen.log"
          done
          test -s build/NeonFoundry-Title.png
          test -s build/NeonFoundry-MainMenu.png
          test -s build/NeonFoundry-Settings.png
          grep -q NEON_FOUNDRY_BLENDER_BACKDROP_READY build/menu-capture-title.log
          grep -q NEON_FOUNDRY_BLENDER_BACKDROP_READY build/menu-capture-menu.log
      - name: Build debug APK
        run: |
          set -euo pipefail
          godot --headless --path game --export-debug Android ../build/NeonFoundry-Racing-debug.apk 2>&1 | tee build/export-debug.log
          test -s build/NeonFoundry-Racing-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/NeonFoundry-Racing-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump packagename build/NeonFoundry-Racing-debug.apk | grep -Fx 'com.tpylman.neonfoundryracing.debug'
      - name: Check signing secrets
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_PASSWORD" && -n "$ANDROID_KEY_ALIAS" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets are incomplete; debug build will be uploaded without release build."
          fi
      - name: Build permanent signed release
        if: steps.signing.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ "$ANDROID_KEYSTORE_PASSWORD" != "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::Godot requires identical keystore and key passwords."
            exit 1
          fi
          key="$RUNNER_TEMP/neonfoundry-release.keystore"
          trap 'rm -f "$key"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key"
          keytool -list -keystore "$key" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          p=Path("game/export_presets.cfg")
          p.write_text(p.read_text().replace("com.tpylman.neonfoundryracing.debug", "com.tpylman.neonfoundryracing"))
          PY
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$key"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$ANDROID_KEY_ALIAS"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          godot --headless --path game --export-release Android ../build/NeonFoundry-Racing.apk 2>&1 | tee build/export-release.log
          test -s build/NeonFoundry-Racing.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs build/NeonFoundry-Racing.apk | tee build/release-signature.txt
          keytool -exportcert -keystore "$key" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" -file "$RUNNER_TEMP/release-cert.der"
          expected=$(sha256sum "$RUNNER_TEMP/release-cert.der" | cut -d' ' -f1)
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' build/release-signature.txt)
          test "$expected" = "$actual"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump packagename build/NeonFoundry-Racing.apk | grep -Fx 'com.tpylman.neonfoundryracing'
      - name: Generate checksums and build manifest
        run: |
          set -euo pipefail
          cd build
          sha256sum *.apk > SHA256SUMS.txt
          printf 'Commit %s\nRun %s\nGodot %s\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$GODOT_VERSION" > BUILD.txt
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeonFoundry-Android-${{ github.run_number }}
          path: build/
          retention-days: 30
          if-no-files-found: warn
