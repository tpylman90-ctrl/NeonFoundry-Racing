name: FORGE AI TripoSR CPU inspection trial

on:
  push:
    branches: [experiments/forge-triposr-trial]
    paths:
      - .github/workflows/forge-triposr-trial.yml
      - tools/ai_forge_triposr_trial.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-forge-ai-mesh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Prepare Forge reference from existing approved image
        run: |
          python -m pip install --disable-pip-version-check 'Pillow==10.1.0'
          python tools/ai_forge_triposr_trial.py prepare
      - name: Install open-source TripoSR CPU inference dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.2.2' 'torchvision==0.17.2'
          python -m pip install 'numpy<2' 'omegaconf==2.3.0' 'Pillow==10.1.0' 'einops==0.7.0' 'transformers==4.35.0' 'trimesh==4.0.5' 'huggingface-hub<1' 'rembg==2.0.60' 'imageio[ffmpeg]' 'xatlas==0.0.9' 'moderngl==5.10.0'
          # torchmcubes interrogates PyTorch at PEP 517 metadata/build time.
          # Build isolation hides the already installed torch; disable it.
          python -c "import torch; print('PYTORCH_AVAILABLE_FOR_EXTENSION_BUILD', torch.__version__)"
          CMAKE_BUILD_PARALLEL_LEVEL=2 python -m pip install --no-build-isolation 'git+https://github.com/tatsy/torchmcubes.git'
          git clone --depth 1 https://github.com/VAST-AI-Research/TripoSR.git /tmp/triposr
          PYTHONPATH=/tmp/triposr python -c "import torch; import torchmcubes; import moderngl; from tsr.system import TSR; from PIL import Image; print('TRIPOSR_CPU_DEPENDENCIES_READY', torch.__version__)"
      - name: Run actual pretrained TripoSR on Forge reference
        run: |
          # TripoSR only creates output/0 for background-removal mode.
          # Our --no-remove-bg mode needs this directory explicitly.
          mkdir -p build/forge_triposr_trial/0
          python /tmp/triposr/run.py \
            build/forge_triposr_trial/forge_front_three_quarter_input.png \
            --device cpu \
            --no-remove-bg \
            --mc-resolution 128 \
            --chunk-size 2048 \
            --model-save-format glb \
            --output-dir build/forge_triposr_trial
      - name: Independently reload and audit AI-generated GLB
        run: python tools/ai_forge_triposr_trial.py audit
      - name: Export experimental inspection package
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FORGE-TripoSR-AI-Inspection-${{ github.run_number }}
          path: build/forge_triposr_trial/
          retention-days: 14
          if-no-files-found: warn
