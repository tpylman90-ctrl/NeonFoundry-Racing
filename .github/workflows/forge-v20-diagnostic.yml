name: NF-H01 / V20 Four-View Reference Diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'tools/forge_v20_reference_diagnostics.py'
      - 'tools/forge_v20_preview.py'
      - '.github/workflows/forge-v20-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free segmentation and mesh dependencies
        run: |
          python -m pip install 'numpy==2.3.5' 'trimesh==4.11.1' 'pillow>=10,<13' 'opencv-python-headless>=4.8,<5' 'networkx==3.6.1'
      - name: Compare genuine V19 GLB to Forge owner's art
        run: |
          set -euo pipefail
          python tools/forge_v20_reference_diagnostics.py | tee /tmp/v20-diagnostic.log
          grep -q NFR_V20_DIAGNOSTIC_COMPLETE /tmp/v20-diagnostic.log
      - name: Render actual GLB and enumerate its assemblies
        run: |
          python tools/forge_v20_preview.py | tee /tmp/forge-preview.log
          grep -q NFR_V20_PREVIEW_OK /tmp/forge-preview.log
      - name: Publish actual diagnostic figures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NF-H01-Forge-V20-Reference-Diagnostics
          path: |
            build/forge_v20_diagnostic/
            build/forge_v20_preview/
          retention-days: 30
      - name: Save immutable inspection data to experimental folder
        if: success()
        run: |
          mkdir -p art/hero_01/experiments/V20_Diagnostic
          cp build/forge_v20_diagnostic/* art/hero_01/experiments/V20_Diagnostic/
          cp build/forge_v20_preview/* art/hero_01/experiments/V20_Diagnostic/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/hero_01/experiments/V20_Diagnostic
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Forge V20 4-view baseline diagnostic'
            git push
          fi
