name: TripoSR official-example & extractor benchmark

on:
  push:
    branches: [experiments/forge-triposr-trial]
    paths:
      - .github/workflows/triposr-official-benchmark.yml
      - tools/triposr_official_benchmark.py
      - tools/triposr_cpu_marching_cubes.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  official-example:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install proven Forge CPU inference dependencies
        id: install
        timeout-minutes: 30
        run: |
          exec > >(tee "$RUNNER_TEMP/triposr_bench_install.log") 2>&1
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.2.2' 'torchvision==0.17.2'
          python -m pip install 'numpy==1.26.4' 'Pillow==10.1.0' 'omegaconf==2.3.0' 'einops==0.7.0' 'transformers==4.35.0' 'trimesh==4.0.5' 'huggingface-hub<1' 'rembg==2.0.60' 'onnxruntime==1.19.2' 'imageio[ffmpeg]' 'xatlas==0.0.9' 'moderngl==5.10.0' 'scikit-image==0.22.0' 'matplotlib==3.8.4'
          python -m pip install --force-reinstall --no-deps 'numpy==1.26.4'
          python -c "import torch,numpy,skimage,scipy,cv2,trimesh; assert numpy.__version__=='1.26.4'; print('BENCH_CPU_DEPENDENCIES_READY',torch.__version__)"
          git clone --depth 1 https://github.com/VAST-AI-Research/TripoSR.git /tmp/triposr
          test -f /tmp/triposr/examples/chair.png
          test "$(git -C /tmp/triposr hash-object /tmp/triposr/examples/chair.png)" = "fee2a21d1c9bbdf707631060f110539401265a1d"
          echo "OFFICIAL_CHAIR_REFERENCE_SHA_VERIFIED"
          cp tools/triposr_cpu_marching_cubes.py /tmp/triposr/tsr/models/mc_cpu_fallback.py
          python -c "from pathlib import Path; p=Path('/tmp/triposr/tsr/models/isosurface.py'); t=p.read_text(); needle='from torchmcubes import marching_cubes'; assert t.count(needle)==1; p.write_text(t.replace(needle,'from .mc_cpu_fallback import marching_cubes'))"
          PYTHONPATH=/tmp/triposr python -c "from tsr.system import TSR; print('OFFICIAL_TRIPOSR_MODEL_IMPORT_OK')"

      - name: Reconstruct official chair at 128 and 256 resolution
        id: inference
        timeout-minutes: 75
        run: |
          exec > >(tee "$RUNNER_TEMP/triposr_bench_inference.log") 2>&1
          for res in 128 256; do
            echo "BEGIN_OFFICIAL_EXAMPLE_MC=${res}"
            python /tmp/triposr/run.py /tmp/triposr/examples/chair.png \
              --device cpu --foreground-ratio 0.85 --mc-resolution "$res" \
              --chunk-size 2048 --model-save-format glb \
              --output-dir "build/triposr_official_benchmark/chair_${res}"
            echo "FINISHED_OFFICIAL_EXAMPLE_MC=${res}"
          done

      - name: Audit official-example reconstruction and produce previews
        id: audit
        run: |
          exec > >(tee "$RUNNER_TEMP/triposr_bench_audit.log") 2>&1
          python tools/triposr_official_benchmark.py audit

      - name: Optional native torchmcubes parity test (not required for baseline)
        id: native_install
        timeout-minutes: 15
        continue-on-error: true
        run: |
          exec > >(tee "$RUNNER_TEMP/triposr_bench_native_install.log") 2>&1
          python -m pip install 'scikit-build-core>=1.0' 'pybind11>=2.10' ninja
          CMAKE_BUILD_PARALLEL_LEVEL=2 python -m pip install --no-build-isolation 'git+https://github.com/tatsy/torchmcubes.git'

      - name: Compare CPU and native marching cubes on asymmetric scalar field
        id: parity
        if: always() && steps.install.outcome == 'success'
        run: |
          exec > >(tee "$RUNNER_TEMP/triposr_bench_parity.log") 2>&1
          python tools/triposr_official_benchmark.py parity

      - name: Save raw meshes, reports and screenshots as independent artifact
        id: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TripoSR-Official-Chair-Benchmark-${{ github.run_number }}
          path: |
            build/triposr_official_benchmark/
            ${{ runner.temp }}/triposr_bench_*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publish bounded benchmark diagnostic for reliable inspection
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const path=require('path');
            const stages={
              install:'${{ steps.install.outcome }}',
              inference:'${{ steps.inference.outcome }}',
              audit:'${{ steps.audit.outcome }}',
              native_install:'${{ steps.native_install.outcome }}',
              parity:'${{ steps.parity.outcome }}',
              artifact:'${{ steps.artifact.outcome }}'
            };
            const errors={};
            for(const k of ['install','inference','audit','native_install','parity']){
              const f=path.join(process.env.RUNNER_TEMP||'/tmp','triposr_bench_'+k+'.log');
              errors[k]=fs.existsSync(f)?fs.readFileSync(f,'utf8').split(/\r?\n/)
                .filter(s=>/exception|error|traceback|failed|out of memory|killed|terminated/i.test(s)).slice(-12)
                .map(s=>s.slice(0,350).replace(/(?:ghp_|github_pat_|hf_)[A-Za-z0-9_-]+/g,'[REDACTED]')):[];
            }
            const {owner,repo}=context.repo;
            const branch=context.ref.replace(/^refs\/heads\//,'');
            const file='art/hero_01/experiments/triposr_official_benchmark_last_run.json';
            const report={
              run_id:context.runId,
              run_url:'https://github.com/'+owner+'/'+repo+'/actions/runs/'+context.runId,
              commit:context.sha,
              status:'${{ job.status }}',stages,errors,
              note:'Independent official-example benchmark; does not change production Forge geometry'
            };
            let sha;
            try{const old=await github.rest.repos.getContent({owner,repo,path:file,ref:branch});sha=old.data.sha;}
            catch(e){if(e.status!==404)throw e;}
            await github.rest.repos.createOrUpdateFileContents({
              owner,repo,path:file,branch,
              message:'ci: record TripoSR official-chair benchmark status',
              content:Buffer.from(JSON.stringify(report,null,2)+'\n').toString('base64'),
              ...(sha?{sha}:{})
            });
