name: Forge V23 simplified blockout through TripoSR

on:
  push:
    branches: [experiments/forge-triposr-trial]
    paths:
      - .github/workflows/forge-triposr-v23-blockout.yml
      - tools/ai_forge_triposr_v23_blockout.py
      - art/hero_01/references/forge_v23_blockout_threequarter_q80.webp.b64
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forge-blockout-v23:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Prepare V23 blockout input, SHA verified
        id: prepare
        run: |
          exec > >(tee "$RUNNER_TEMP/forge_blockout_prepare.log") 2>&1
          python -m pip install 'Pillow==10.1.0' 'numpy==1.26.4'
          python tools/ai_forge_triposr_v23_blockout.py prepare
      - name: Install official native torchmcubes instead of fallback
        id: native
        timeout-minutes: 35
        run: |
          exec > >(tee "$RUNNER_TEMP/forge_blockout_install.log") 2>&1
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.2.2' 'torchvision==0.17.2'
          python -m pip install 'numpy==1.26.4' 'Pillow==10.1.0' 'omegaconf==2.3.0' 'einops==0.7.0' 'transformers==4.35.0' 'trimesh==4.0.5' 'huggingface-hub<1' 'rembg==2.0.60' 'onnxruntime==1.19.2' 'imageio[ffmpeg]' 'xatlas==0.0.9' 'moderngl==5.10.0' 'scikit-image==0.22.0'
          python -m pip install --force-reinstall --no-deps 'numpy==1.26.4'
          python -m pip install 'scikit-build-core>=1.0' 'pybind11>=2.10' ninja
          CMAKE_BUILD_PARALLEL_LEVEL=2 python -m pip install --no-build-isolation 'git+https://github.com/tatsy/torchmcubes.git'
          python -c "import torch,numpy,torchmcubes; from torchmcubes import marching_cubes; assert numpy.__version__=='1.26.4'; print('OFFICIAL_NATIVE_TORCHMCUBES_READY')"
          git clone --depth 1 https://github.com/VAST-AI-Research/TripoSR.git /tmp/triposr
          PYTHONPATH=/tmp/triposr python -c "from tsr.system import TSR; from torchmcubes import marching_cubes; print('TRIPOSR_UNMODIFIED_OFFICIAL_IMPORTS_OK')"
      - name: Reconstruct original V23 blockout reference with native TripoSR
        id: inference
        timeout-minutes: 70
        run: |
          exec > >(tee "$RUNNER_TEMP/forge_blockout_inference.log") 2>&1
          mkdir -p build/forge_triposr_v23_blockout/0
          python /tmp/triposr/run.py build/forge_triposr_v23_blockout/forge_input.png \
            --device cpu --no-remove-bg --mc-resolution 256 \
            --chunk-size 2048 --model-save-format glb \
            --output-dir build/forge_triposr_v23_blockout
      - name: Audit native Forge 256 GLB
        id: audit
        run: |
          exec > >(tee "$RUNNER_TEMP/forge_blockout_audit.log") 2>&1
          python tools/ai_forge_triposr_v23_blockout.py audit
      - name: Save inspectable native GLB and provenance
        id: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FORGE-V23-Blockout-TripoSR-${{ github.run_number }}
          path: |
            build/forge_triposr_v23_blockout/
            ${{ runner.temp }}/forge_blockout_*.log
          retention-days: 14
          if-no-files-found: warn
      - name: Record bounded diagnostics in experiment branch
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'), path=require('path');
            const stages={
              prepare:'${{ steps.prepare.outcome }}',
              native:'${{ steps.native.outcome }}',
              inference:'${{ steps.inference.outcome }}',
              audit:'${{ steps.audit.outcome }}',
              artifact:'${{ steps.artifact.outcome }}'
            };
            const errors={};
            for(const [stage,log] of Object.entries({
              prepare:'prepare',native:'install',inference:'inference',audit:'audit'
            })){
              const p=path.join(process.env.RUNNER_TEMP||'/tmp','forge_blockout_'+log+'.log');
              errors[stage]=fs.existsSync(p)?fs.readFileSync(p,'utf8').split(/\r?\n/)
                .filter(x=>/traceback|error|failed|exception|out of memory|killed/i.test(x)).slice(-10)
                .map(x=>x.slice(0,350).replace(/(?:ghp_|github_pat_|hf_)[A-Za-z0-9_-]+/g,'[REDACTED]')):[];
            }
            const {owner,repo}=context.repo;
            const branch=context.ref.replace(/^refs\/heads\//,'');
            const file='art/hero_01/experiments/forge_v23_blockout_last_run.json';
            const obj={
              run_id:context.runId,
              run_url:'https://github.com/'+owner+'/'+repo+'/actions/runs/'+context.runId,
              commit:context.sha,status:'${{ job.status }}',stages,errors,
              note:'Native extractor experiment; uses original V23 low-poly blockout render. No production assets changed.'
            };
            let sha;
            try{const old=await github.rest.repos.getContent({owner,repo,path:file,ref:branch});sha=old.data.sha;}
            catch(e){if(e.status!==404)throw e;}
            await github.rest.repos.createOrUpdateFileContents({
              owner,repo,path:file,branch,message:'ci: record Forge V23 blockout reconstruction',
              content:Buffer.from(JSON.stringify(obj,null,2)+'\n').toString('base64'),
              ...(sha?{sha}:{})
            });
