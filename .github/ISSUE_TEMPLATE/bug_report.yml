name: Bug report
description: Report a reproducible problem.
title: "[BUG] "
body:
  - type: textarea
    id: summary
    attributes:
      label: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: input
    id: context
    attributes:
      label: Build, Android device, renderer, FPS
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Do not paste secrets or private signing materials.
